[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "INTENT2FIX"
version = "0.0.12"
description = ""
authors = [ "Anonymous <anonymous@INTENT2FIX.ai>",]
readme = "README.md"
packages = [{ include = "INTENT2FIX" }]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[tool.poetry.scripts]
INTENT2FIX-api = "INTENT2FIX.api:run_api"
build-ui = "build_ui:main"

[tool.ruff]
target-version = "py310"
extend-exclude = [ "tests", "evaluations", "notebooks",]

[tool.poetry.dependencies]
python = ">=3.11,<3.13" 

pydantic = "^2.8.2"
tiktoken = "^0.8.0"
networkx = "^3.3"
tree-sitter = "0.24.0"
tree-sitter-c = "0.23.2"
tree-sitter-python = "0.23.6"
tree-sitter-java = "0.23.5"
rapidfuzz = "^3.9.5"
gitpython = "^3.1.43"
unidiff = "^0.7.5"
python-dotenv = "1.0.1"
docstring-parser = "^0.16"

numpy = "^1.0"
pylint = "^3.2.6"

# For LLM integrations

# !!! Use this to able to use Claude's computer use tool types https://github.com/BerriAI/litellm/pull/7805
#litellm = { git = "https://github.com/BerriAI/litellm.git", branch = "anthropic-computer-use" }
litellm = "^1.59.3"

instructor = "<=1.6.3"

openai = "^1.41.0"
anthropic = "^0.38.0"

botocore = "^1.35.54"
boto3 = "^1.35.54"

# Vector Index
llama-index = "^0.12.11"
llama-index-embeddings-openai = "^0.3.1"
llama-index-embeddings-voyageai = "^0.3.4"
llama-index-readers-file = "^0.4.3"
faiss-cpu = "^1.8.0.post1"
voyageai = "^0.3.2"

filelock = "^3.16.1"

# code_intent（原 code_intent/requirements.txt，由 Poetry 统一版本）
clang = "18.1.8"
libclang = "18.1.1"
httpx = "^0.27.0"
tqdm = "^4.66.0"
matplotlib = "^3.9.0"
neo4j = "^5.22.0"
igraph = "^0.11.0"
leidenalg = "^0.10.2"

# TODO: Image and PDF handling
# Pillow = "^11.1.0"
# pymupdf = "^1.25.1"

# API（与 code_intent 中 fastapi/uvicorn 需求对齐，默认安装）
click = "^8.1.7"
fastapi = "^0.115.7"
uvicorn = "^0.34.0"
python-multipart = "^0.0.20"

# Streamlit dependencies
streamlit = { version = "^1.41.1", optional = true }
plotly = { version = "^5.24.1", optional = true }
pygraphviz = { version = "^1.14", optional = true }
scikit-learn = "^1.6.1"

# Docker dependency
docker = "^7.0.0"  # 添加 docker 依赖
simple-parsing = "^0.1.7"
gymnasium = "^1.1.1"

[tool.ruff.lint]
select = [ "B", "DTZ", "E", "F", "I", "LOG", "N", "PLE", "SIM", "T20", "UP",]
ignore = [ "E501", "F401", "UP007" ]
line-qlength = 120

[tool.poetry.group.dev.dependencies]
pytest = "8.3.2"
pytest-mock = "3.14.0"
mypy = "1.10.0"
ruff = "0.5.5"

[tool.poetry.extras]
streamlit = ["streamlit", "plotly", "pygraphviz"]
all = ["streamlit", "plotly", "pygraphviz"]